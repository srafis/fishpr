[package]
name = "fishpr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = "0.3.6"
libc = "0.2.189"
reqwest = { version = "0.13.5", features = ["multipart", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs"] }
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
strip = true
lto = true
