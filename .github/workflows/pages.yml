# Publish site/ to GitHub Pages (https://srafis.github.io/fishpr/) whenever it
# changes on main.
#
# One-time setup, before the first run: Settings → Pages → Build and deployment
# → Source: GitHub Actions. Or, as a repo admin:
#
#   gh api -X POST repos/srafis/fishpr/pages -f build_type=workflow
#
# Until then, configure-pages fails with "Get Pages site failed ... Not Found".

name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
